<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#a06cf9"/>
    </linearGradient>
  </defs>
  <!-- marco -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="#0d1117" stroke="url(#g)" stroke-width="4"/>
  <!-- ventana de terminal -->
  <rect x="22" y="28" width="84" height="62" rx="8" fill="#161b24" stroke="#2c3442" stroke-width="2"/>
  <circle cx="33" cy="38" r="3" fill="#e5534b"/>
  <circle cx="43" cy="38" r="3" fill="#f0b45a"/>
  <circle cx="53" cy="38" r="3" fill="#6fdc8c"/>
  <!-- prompt -->
  <text x="31" y="58" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6fdc8c">&gt;_</text>
  <!-- LSD -->
  <text x="30" y="82" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="bold" fill="url(#g)" letter-spacing="2">LSD</text>
  <rect x="88" y="72" width="12" height="14" fill="#4f9cf9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- pantallas apiladas (sesiones) -->
  <path d="M30 102 h68" stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M40 110 h48" stroke="#2c3442" stroke-width="4" stroke-linecap="round"/>
</svg>
